name: Deploy Tech B.Log

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Tell Bing, Naver and other IndexNow engines that the site changed.
  # Google does not use IndexNow; it reads sitemap.xml (submitted in Search Console).
  indexnow:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SITE: https://noahwannagohome.github.io/tech-b-log/
      INDEXNOW_KEY: 6a6b17851e8993236d080c6941af8ed8
    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          # Pages can take a moment to go live after deploy-pages finishes.
          for i in 1 2 3 4 5 6; do
            curl -fsS "${SITE}${INDEXNOW_KEY}.txt" | grep -qx "$INDEXNOW_KEY" && break
            sleep 10
          done
          urls=$(curl -fsS "${SITE}sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -R . | jq -s .)
          jq -n --arg key "$INDEXNOW_KEY" --arg site "$SITE" --argjson urls "$urls" \
            '{host: "noahwannagohome.github.io", key: $key, keyLocation: ($site + $key + ".txt"), urlList: $urls}' \
            > payload.json
          cat payload.json
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @payload.json https://api.indexnow.org/indexnow
